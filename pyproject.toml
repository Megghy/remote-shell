[project]
name = "remote-shell-mcp"
version = "0.3.1"
description = "Remote shell MCP server with automatic WinRM and SSH connection reuse."
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.5",
  "filelock>=4.2.0",
  "keyring>=25.6.0",
  "mcp>=1.12.4",
  "paramiko>=3.5.1",
]

[project.scripts]
remote-shell-mcp = "remote_shell_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_shell_mcp"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]
